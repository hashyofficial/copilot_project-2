name: HyperOS1 Yunluo Build 4 - Official Custom ROM Release v1.0.0

# Only this workflow creation triggers the actual build. Keep stock and earlier
# experimental workflows untouched. Distribution is GitHub Release ONLY.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hyperos-build4-official-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hyperos-build4-official-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HYPEROS_ARCHIVE: ${{ github.workspace }}/.hyperos-work/stock/yunluo_global_images_OS1.0.9.0.ULYMIXM_20250416.0000.00_14.0_global_f8dbb84a10.tgz
      HYPEROS_REPORTS: ${{ github.workspace }}/.hyperos-work/reports
      BUILD4_REPORTS: ${{ github.workspace }}/.hyperos-work/reports
      BUILD4_PRIVATE: ${{ github.workspace }}/.hyperos-work/private
      BUILD4_OUTPUT: ${{ github.workspace }}/.hyperos-work/release
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact 48-package removal selection and protected Android components
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile workflow/hyperos/*.py scripts/hyperos_build4.py scripts/hyperos_package4.py stage3/scan.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"scripts")
          from hyperos_build4 import selected, PROTECT
          x=selected()
          assert len(x)==48 and not set(x).intersection(PROTECT)
          expected={
              "com.google.android.apps.safetyhub":61,
              "com.google.android.printservice.recommendation":152,
              "com.google.android.feedback":186,
              "com.bsp.catchlog":46,
              "com.android.dreams.basic":111,
              "com.miui.miservice":68,
              "com.xiaomi.payment":102,
              "cn.wps.xiaomi.abroad.lite":103,
              "com.android.apps.tag":162,
          }
          for pkg,number in expected.items():
              assert x[pkg]==number,(pkg,x.get(pkg))
          essential={
              "com.google.android.gm","com.google.android.calendar",
              "com.google.android.contacts","com.google.android.as",
              "com.google.android.as.oss","com.google.android.overlay.gmsconfig.asi",
              "com.google.android.syncadapters.calendar","com.miui.gallery",
              "com.miui.securitycenter","com.miui.cleaner","com.android.phone",
              "com.android.providers.contacts","com.google.android.gms",
          }
          assert not essential.intersection(x)
          assert "com.google.android.projection.gearhead" not in x
          print("PASS: 48 unique user-approved stock APK IDs; retained Gmail, Calendar, Contacts, Intelligence, Private Compute, Gallery, Networking and APEX")
          PY
          mkdir -p "$BUILD4_REPORTS" "$BUILD4_PRIVATE" "$BUILD4_OUTPUT" "$(dirname "$HYPEROS_ARCHIVE")"

      - name: Install pinned Android image tools and EROFS utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl ca-certificates attr erofs-utils file python3 util-linux
          python3 workflow/hyperos/inventory.py --install-tools
          test -x .tools/android-tools-static/lpunpack
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 | head
          df -h "$RUNNER_TEMP"

      - name: Download original checksum-verified Xiaomi HyperOS 1 Global stock firmware
        shell: bash
        run: |
          set -euo pipefail
          python3 workflow/hyperos/download.py --output "$HYPEROS_ARCHIVE" --report "$BUILD4_REPORTS/download-sources.json"
          echo "f8dbb84a10dc96a9d3ce9e78883e87f3  $HYPEROS_ARCHIVE" | md5sum -c -
          sha256sum "$HYPEROS_ARCHIVE" | tee "$BUILD4_REPORTS/source-archive-sha256.txt"

      - name: Rebuild only affected EROFS images, delete whole app directories and audit all app-owned libs
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=HYPEROS_ARCHIVE,HYPEROS_REPORTS,BUILD4_REPORTS,BUILD4_PRIVATE,RUNNER_TEMP,ANDROID_HOME \
            python3 -u scripts/hyperos_build4.py
          sudo chown -R "$(id -u):$(id -g)" "$BUILD4_REPORTS" "$BUILD4_PRIVATE"
          python3 - <<'PY'
          import os,json,pathlib
          private=pathlib.Path(os.environ["BUILD4_PRIVATE"])
          reports=pathlib.Path(os.environ["BUILD4_REPORTS"])
          m=json.loads((private/"manifest.json").read_text())
          assert m["selected_package_count"]==48 and m["removed_apk_count"]==48
          assert m["entire_app_folders_removed"]==46
          assert m["individual_shared_overlay_apks_removed"]==2
          assert m["all_selected_folder_paths_absent_after_rebuild"]
          assert sorted(m["rebuilt_partitions"])==["mi_ext_a","product_a","system_a","system_ext_a"]
          assert m["source_lp_metadata_preserved"] and m["retained_apks_same_bytes_owner_mode_selinux"]
          assert m["other_lp_regions_unchanged"]
          assert m["owned_file_count_removed"]>=46
          assert all(p["removed_paths_absent_after_rebuild"] and p["removed_folder_contents_audited"] for p in m["partitions"])
          assert (private/"super.sparse.img").stat().st_size>100_000_000
          for partition in m["rebuilt_partitions"]:
              audit=json.loads((reports/("removed-folders-content-"+partition+".json")).read_text())
              assert audit["whole_directories_deleted"]==next(p["whole_app_folders_removed"] for p in m["partitions"] if p["partition"]==partition)
              assert audit["app_owned_file_count"]>=audit["whole_directories_deleted"]
          print("PASS: 46 entire app folders plus all their app-owned files/libraries removed; 2 shared overlays removed individually")
          print("Audited total app-owned files:",m["owned_file_count_removed"])
          print("Audited app-owned JNI/native libraries:",m["owned_native_libraries_removed"])
          print("Audited app-owned compiled-code files:",m["owned_compiled_files_removed"])
          PY

      - name: Package and validate COMPLETE fastboot ZIP, vbmeta, Xiaomi CRC and segment SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/hyperos_package4.py
          python3 - <<'PY'
          import os,pathlib,json,hashlib
          out=pathlib.Path(os.environ["BUILD4_OUTPUT"])
          rep=pathlib.Path(os.environ["BUILD4_REPORTS"])
          v=json.loads((rep/"FASTBOOT_TEST_VERIFICATION.json").read_text())
          assert v["status"]=="offline_verified_NOT_device_boot_tested"
          assert v["release_target"]=="v1.0.0"
          assert v["selected_package_count"]==48 and v["removed_apk_count"]==48
          assert v["entire_app_folders_removed"]==46 and v["individual_shared_overlay_apks_removed"]==2
          assert v["vbmeta_flags"]==3 and v["flash_scripts_preserved"]
          assert v["other_firmware_files_unchanged"] and v["all_selected_folder_paths_absent_after_rebuild"]
          assert v["owned_file_count_removed"]>=46 and v["stock_system_apex_unchanged"]
          assert len(v["parts"])>=2
          assert sum(p["bytes"] for p in v["parts"])==v["full_zip_bytes"]
          for p in v["parts"]:
              assert p["bytes"]<2_000_000_000
              path=out/p["filename"]
              assert path.exists() and path.stat().st_size==p["bytes"]
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for b in iter(lambda:f.read(8*1024*1024),b""):h.update(b)
              assert h.hexdigest()==p["sha256"]
          print("PASS: Full Xiaomi fastboot ZIP tested and SHA256-matched, original flash scripts verified; GitHub Release chunks checked")
          PY

      - name: Include complete removal, native-library audit and user-facing changelog in release
        shell: bash
        run: |
          set -euo pipefail
          cp release/HyperOS1-Yunluo-Build4-Official-v1.0.0-CHANGELOG.md "$BUILD4_OUTPUT/CHANGELOG.md"
          cp config/hyperos-build4-official-selected.txt "$BUILD4_OUTPUT/REMOVAL_LIST_48_PACKAGES.txt"
          cp "$BUILD4_REPORTS/FASTBOOT_TEST_VERIFICATION.json" "$BUILD4_OUTPUT/FASTBOOT_VERIFICATION.json"
          cp "$BUILD4_REPORTS/build4-super-verification.json" "$BUILD4_OUTPUT/SUPER_VERIFICATION.json"
          python3 - <<'PY'
          import os,json,pathlib,zipfile
          report=pathlib.Path(os.environ["BUILD4_REPORTS"])
          dest=pathlib.Path(os.environ["BUILD4_OUTPUT"])
          with zipfile.ZipFile(dest/"APP_FOLDER_AND_LIBRARIES_AUDIT.zip","w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              audits=sorted(report.glob("removed-folders-content-*.json"))
              if len(audits)!=4:raise RuntimeError("Missing one or more app file content audits")
              for audit in audits:z.write(audit,audit.name)
          v=json.loads((dest/"FASTBOOT_VERIFICATION.json").read_text())
          with (dest/"CHANGELOG.md").open("a",encoding="utf-8") as f:
              f.write("\n## Verified built-image folder/library audit\n\n")
              f.write(f"- Recursively removed app-owned files: {v['owned_file_count_removed']}\n")
              f.write(f"- App-owned native libraries inside removed folders: {v['owned_native_libraries_removed']}\n")
              f.write(f"- App-owned compiled code files inside removed folders: {v['owned_compiled_files_removed']}\n")
              f.write("- External shared libraries have not been deleted without exclusive-ownership proof.\n")
          print("Final removal and native library audit ZIP created")
          PY

      - name: Upload and verify complete firmware assets to DRAFT official GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v1.0.0
          gh release create "$TAG" \
            "$BUILD4_OUTPUT/"*.part* \
            "$BUILD4_OUTPUT/ZIP_SHA256.txt" \
            "$BUILD4_OUTPUT/PARTS_SHA256.txt" \
            "$BUILD4_OUTPUT/WINDOWS_JOIN_FULL_FIRMWARE.ps1" \
            "$BUILD4_OUTPUT/DOWNLOAD_INSTRUCTIONS.txt" \
            "$BUILD4_OUTPUT/CHANGELOG.md" \
            "$BUILD4_OUTPUT/REMOVAL_LIST_48_PACKAGES.txt" \
            "$BUILD4_OUTPUT/APP_FOLDER_AND_LIBRARIES_AUDIT.zip" \
            "$BUILD4_OUTPUT/FASTBOOT_VERIFICATION.json" \
            "$BUILD4_OUTPUT/SUPER_VERIFICATION.json" \
            --title "HyperOS1 Yunluo - Build 4 Official (v1.0.0)" \
            --notes-file "$BUILD4_OUTPUT/CHANGELOG.md" \
            --target "$GITHUB_SHA" \
            --draft
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$BUILD4_REPORTS/github-release-staged.json"
          python3 - <<'PY'
          import pathlib,json,os
          root=pathlib.Path(os.environ["BUILD4_OUTPUT"])
          release=json.loads((pathlib.Path(os.environ["BUILD4_REPORTS"])/"github-release-staged.json").read_text())
          assert release["draft"] is True and release["tag_name"]=="v1.0.0"
          asset_sizes={asset["name"]:asset["size"] for asset in release["assets"]}
          local={p.name:p.stat().st_size for p in root.iterdir() if p.is_file()}
          if asset_sizes!=local:
              raise RuntimeError("Published draft release assets differ from full local firmware files: "+repr((asset_sizes,local)))
          assert len([n for n in asset_sizes if n.endswith(".part001")])==1
          assert len([n for n in asset_sizes if ".zip.part" in n])>=2
          print("PASS: Every complete-firmware segment, SHA256, changelog and folder audit uploaded and size-verified on GitHub",len(local),"assets")
          PY

      - name: Delete obsolete v.0.1 and v.0.2 releases AND tags after new draft assets are fully verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # All old firmware stays available unless the new v1.0.0 draft passes all checks.
          for OLD in v.0.1 v.0.2; do
            if gh release view "$OLD" >/dev/null 2>&1; then
              gh release delete "$OLD" --cleanup-tag --yes
              echo "Deleted old GitHub Release and tag $OLD"
            else
              # Delete lingering old tag, if release was previously removed.
              if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$OLD" >/dev/null 2>&1; then
                gh api -X DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$OLD"
                echo "Deleted orphan tag $OLD"
              fi
            fi
            if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$OLD" >/dev/null 2>&1; then
              echo "Refusing to publish official release: old tag $OLD still exists" >&2
              exit 1
            fi
          done

      - name: Publish official custom-ROM v1.0.0 Release (not a prerelease or Actions artifact)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit v1.0.0 --draft=false --prerelease=false
          gh release view v1.0.0 --json url,name,tagName,isDraft,isPrerelease,assets --jq '{url,name,tagName,isDraft,isPrerelease,assetNames:[.assets[].name]}'
