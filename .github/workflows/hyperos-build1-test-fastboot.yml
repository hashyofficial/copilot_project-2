name: HyperOS Build 1 TEST - 101 Selected Packages Removed

# No GitHub Release; after offline verification upload a split full-fastboot ZIP as Actions artifacts only.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hyperos-build1-test-fastboot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperos-test-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HYPEROS_ARCHIVE: ${{ github.workspace }}/.hyperos-work/stock/yunluo_global_images_OS1.0.9.0.ULYMIXM_20250416.0000.00_14.0_global_f8dbb84a10.tgz
      HYPEROS_REPORTS: ${{ github.workspace }}/.hyperos-work/reports
      BUILD1_REPORTS: ${{ github.workspace }}/.hyperos-work/reports
      BUILD1_PRIVATE: ${{ github.workspace }}/.hyperos-work/private
      BUILD1_OUTPUT: ${{ github.workspace }}/.hyperos-work/download
    steps:
      - uses: actions/checkout@v4
      - name: Verify source scripts and exact removal policy before download
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile workflow/hyperos/*.py scripts/hyperos_*.py stage3/scan.py
          python3 - <<'PY'
          import pathlib,re,sys
          sys.path.insert(0,'scripts')
          from hyperos_build import selected,PROTECT,RAW_SHA,RAW_BYTES
          x=selected()
          assert len(x)==101 and x.keys().isdisjoint(PROTECT)
          assert RAW_BYTES==9126805504
          assert len(RAW_SHA)==64
          assert x["com.android.phone"]==142
          assert x["com.android.stk"]==158
          assert "com.miui.cleaner" not in x
          assert "com.google.android.setupwizard" not in x
          assert "com.google.android.partnersetup" not in x
          print("Latest TEST sheet verified: 101 packages; Cleaner and Setup Wizard retained")
          PY
          mkdir -p "$HYPEROS_REPORTS" "$BUILD1_PRIVATE" "$BUILD1_OUTPUT" "$(dirname "$HYPEROS_ARCHIVE")"
      - name: Install EROFS and verified Android image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl ca-certificates attr erofs-utils file python3 util-linux
          python3 workflow/hyperos/inventory.py --install-tools
          find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt2 | head
          df -h "$RUNNER_TEMP"
      - name: Download checksum-pinned HyperOS Global fastboot stock through fast Xiaomi CDN
        shell: bash
        run: |
          set -euo pipefail
          python3 workflow/hyperos/download.py --output "$HYPEROS_ARCHIVE" --report "$BUILD1_REPORTS/download-sources.json"
          echo "f8dbb84a10dc96a9d3ce9e78883e87f3  $HYPEROS_ARCHIVE" | md5sum -c -
          sha256sum "$HYPEROS_ARCHIVE" | tee "$BUILD1_REPORTS/source-archive-sha256.txt"
      - name: Rebuild 4 affected EROFS images and offline-check all selected and retained APKs
        shell: bash
        run: |
          set -euo pipefail
          sudo --preserve-env=HYPEROS_ARCHIVE,HYPEROS_REPORTS,BUILD1_REPORTS,BUILD1_PRIVATE,RUNNER_TEMP,ANDROID_HOME \
            python3 -u scripts/hyperos_build.py
          sudo chown -R "$(id -u):$(id -g)" "$BUILD1_REPORTS" "$BUILD1_PRIVATE"
          python3 - <<'PY'
          import os,json,pathlib
          private=pathlib.Path(os.environ["BUILD1_PRIVATE"])
          meta=json.loads((private/"manifest.json").read_text())
          assert meta["removed_apk_count"]==102 and meta["selected_package_count"]==101
          assert sorted(meta["rebuilt_partitions"])==["mi_ext_a","product_a","system_a","system_ext_a"]
          assert meta["source_lp_metadata_preserved"]
          assert meta["retained_apks_same_bytes_owner_mode_selinux"]
          assert meta["entire_app_folders_removed"]==90
          assert meta["individual_shared_overlay_apks_removed"]==12
          assert meta["all_selected_folder_paths_absent_after_rebuild"]
          assert all(p["removed_paths_absent_after_rebuild"] for p in meta["partitions"])
          assert (private/"super.sparse.img").stat().st_size>100_000_000
          print("Super rebuild passed: 90 COMPLETE app folders removed + 12 shared overlay APKs; original retained APKs verified")
          PY
      - name: Pack complete Xiaomi fastboot test ZIP; patch main vbmeta and CRC lists; validate and split
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/hyperos_package.py
          python3 - <<'PY'
          import os,pathlib,json,hashlib
          out=pathlib.Path(os.environ["BUILD1_OUTPUT"])
          rep=pathlib.Path(os.environ["BUILD1_REPORTS"])
          m=json.loads((rep/"FASTBOOT_TEST_VERIFICATION.json").read_text())
          assert m["status"]=="offline_verified_NOT_device_boot_tested"
          assert m["removed_apk_count"]==102 and m["selected_package_count"]==101
          assert m["entire_app_folders_removed"]==90 and m["individual_shared_overlay_apks_removed"]==12
          assert m["vbmeta_flags"]==3
          assert m["other_firmware_files_unchanged"]
          assert len(m["parts"])>=4
          total=sum(x["bytes"] for x in m["parts"])
          assert total==m["full_zip_bytes"]
          print("Offline verified full-fastboot firmware, split ZIP parts:",len(m["parts"]))
          PY
      - name: Upload complete flashing TEST firmware ZIP parts (NOT a Release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yunluo-HyperOS1-Global-Build1-TEST-fastboot-all-parts
          path: ${{ github.workspace }}/.hyperos-work/download/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload independent build and checksum reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunluo-HyperOS1-Build1-TEST-offline-verification
          path: ${{ github.workspace }}/.hyperos-work/reports/
          retention-days: 30
          if-no-files-found: warn
